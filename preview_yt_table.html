<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Channel Finder — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #F1F5F9;
      color: #1E293B;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Header ── */
    .header { margin-bottom: 20px; }
    .header h1 { font-size: 22px; font-weight: 700; color: #6366F1; display: flex; align-items: center; gap: 8px; }
    .header p  { font-size: 13px; color: #64748B; margin-top: 4px; }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card-header {
      padding: 14px 20px;
      border-bottom: 1px solid #F1F5F9;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header .count-badge {
      background: #EEF2FF;
      color: #6366F1;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
    }
    .card-header .action-btns {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 5px 14px;
      border-radius: 7px;
      border: 1px solid #E2E8F0;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: #fff;
      color: #475569;
      transition: all .15s;
    }
    .btn:hover { background: #F8FAFC; border-color: #CBD5E1; }
    .btn.primary { background: #6366F1; color: #fff; border-color: #6366F1; }
    .btn.primary:hover { background: #4F46E5; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      background: #F8FAFC;
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: .04em;
      border-bottom: 1px solid #E2E8F0;
      white-space: nowrap;
    }
    thead th.center { text-align: center; }

    tbody tr {
      border-bottom: 1px solid #F1F5F9;
      transition: background .12s;
    }
    tbody tr:hover { background: #F8FAFC; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr.checked { background: #EEF2FF; }
    tbody tr.checked:hover { background: #E0E7FF; }

    td { padding: 12px 14px; vertical-align: middle; }
    td.center { text-align: center; }

    /* Checkbox */
    .chk {
      width: 17px; height: 17px;
      cursor: pointer;
      accent-color: #6366F1;
    }

    /* Channel name */
    .ch-name { font-weight: 600; color: #1E293B; line-height: 1.3; }
    .ch-handle { font-size: 11px; color: #94A3B8; margin-top: 2px; }

    /* Country */
    .country {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px; font-weight: 500;
      background: #ECFDF5; color: #059669;
      white-space: nowrap;
    }
    .country.unknown { background: #F8FAFC; color: #94A3B8; }

    /* Subscribers */
    .subs {
      font-weight: 600; font-size: 13px; color: #6366F1;
      text-align: center; white-space: nowrap;
    }
    .subs.empty { color: #CBD5E1; }

    /* Description */
    .desc { color: #64748B; font-size: 12px; max-width: 260px; }

    /* URL */
    .url-cell a {
      color: #3B82F6;
      text-decoration: none;
      font-size: 12px;
      display: flex; align-items: center; gap: 5px;
      transition: color .12s;
    }
    .url-cell a:hover { color: #2563EB; text-decoration: underline; }
    .url-icon { font-size: 11px; opacity: .7; }

    /* Progress bar (demo) */
    .progress-bar {
      height: 4px;
      background: #EEF2FF;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 20px 0 0;
    }
    .progress-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #6366F1, #8B5CF6);
      border-radius: 4px;
      animation: prog 1.8s ease-in-out infinite;
    }
    @keyframes prog {
      0%   { width: 0%; }
      50%  { width: 80%; }
      100% { width: 100%; }
    }

    /* Search bar demo */
    .search-section {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
      padding: 18px 20px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .search-label { font-size: 12px; font-weight: 600; color: #64748B; min-width: 80px; }
    .search-input {
      flex: 1; min-width: 200px;
      padding: 8px 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 13px;
      color: #1E293B;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: #6366F1; box-shadow: 0 0 0 3px #EEF2FF; }
    .select-styled {
      padding: 8px 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: #1E293B;
      background: #fff;
      cursor: pointer;
    }
    .status-text { font-size: 12px; color: #6366F1; font-style: italic; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94A3B8;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* Action footer */
    .action-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      background: #F8FAFC;
      border-top: 1px solid #E2E8F0;
      flex-wrap: wrap;
    }
    .action-info { margin-left: auto; font-size: 12px; font-weight: 600; color: #10B981; }

    /* Tooltip-like tag */
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: #EEF2FF; color: #6366F1;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🔎 YouTube Channel Finder</h1>
  <p>Preview giao diện bảng kết quả · Dữ liệu mẫu để kiểm tra layout</p>
</div>

<!-- Search section (readonly demo) -->
<div class="search-section">
  <div class="search-row">
    <span class="search-label">Từ khóa:</span>
    <input class="search-input" type="text" value="cooking channel" readonly />
    <span class="search-label" style="min-width:auto">🌍 Quốc gia:</span>
    <select class="select-styled">
      <option>🇩🇪  Đức  (Deutsch)</option>
      <option>🌍  Tất cả quốc gia</option>
      <option>🇺🇸  Mỹ  (English)</option>
    </select>
    <span class="search-label" style="min-width:auto">Số kết quả:</span>
    <select class="select-styled"><option>20 kênh</option></select>
  </div>
  <div class="search-row">
    <span class="search-label">👥 Lọc Sub:</span>
    <select class="select-styled">
      <option>10K – 100K</option>
      <option>Tất cả</option>
    </select>
    <span class="tag">✅ Chỉ lấy kênh đúng quốc gia</span>
    <button class="btn primary" style="padding:8px 20px;font-size:13px">🔍 Tìm kiếm</button>
    <button class="btn" style="padding:8px 14px;font-size:13px;color:#DC2626;border-color:#FCA5A5">⏹ Dừng</button>
    <div class="progress-bar" style="flex:1;min-width:80px"><div class="progress-bar-inner"></div></div>
    <span class="status-text">📊 Thông tin kênh 12/20...</span>
  </div>
</div>

<!-- Results table -->
<div class="card">
  <div class="card-header">
    📋 Kết quả &nbsp;·&nbsp; Click URL để mở Chrome
    <span class="count-badge">8 kênh</span>
    <div class="action-btns">
      <button class="btn">☑ Chọn tất cả</button>
      <button class="btn">☐ Bỏ chọn</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="center" style="width:44px">✓</th>
          <th style="width:200px">Kênh</th>
          <th class="center" style="width:120px">🌏 Quốc gia</th>
          <th class="center" style="width:120px">Subscribers</th>
          <th>Mô tả</th>
          <th style="width:280px">🔗 URL (click để mở)</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="action-bar">
    <button class="btn primary">📋 Copy URL đã chọn</button>
    <button class="btn">📋 Copy tất cả URL</button>
    <button class="btn">📥 Xuất .txt</button>
    <span class="action-info" id="action-info"></span>
  </div>
</div>

<script>
const DATA = [
  { name: "DasKochrezept",    handle: "@DasKochrezept",    country: "🇩🇪 Đức",   subs: "82.4K subs",  desc: "Einfache deutsche Rezepte für jeden Tag. Kochen leicht gemacht!",                    url: "https://www.youtube.com/@DasKochrezept" },
  { name: "Küchengötter",     handle: "@Kuechengotter",    country: "🇩🇪 Đức",   subs: "45.1K subs",  desc: "Traditionelle deutsche Küche, Backen und Kochen auf Deutsch.",                    url: "https://www.youtube.com/@Kuechengotter" },
  { name: "Simply Yummy",     handle: "@SimplyYummy",      country: "—",          subs: "—",           desc: "Quick easy recipes, desserts and meal prep ideas for busy people.",               url: "https://www.youtube.com/@SimplyYummy" },
  { name: "GutKochen TV",     handle: "@GutKochenTV",      country: "🇩🇪 Đức",   subs: "31.0K subs",  desc: "Gesund und lecker kochen — Rezepte aus der deutschen Alltagsküche.",             url: "https://www.youtube.com/@GutKochenTV" },
  { name: "Chefkoch",         handle: "@Chefkoch",         country: "🇩🇪 Đức",   subs: "598K subs",   desc: "Deutschlands größte Rezeptseite. Täglich neue Kochvideos und Inspiration.",       url: "https://www.youtube.com/@Chefkoch" },
  { name: "Baking Nicky",     handle: "@BakingNicky",      country: "🇦🇹 Áo",    subs: "18.7K subs",  desc: "Backen auf Österreichisch – Torten, Kuchen und süße Verführungen.",               url: "https://www.youtube.com/@BakingNicky" },
  { name: "FoodTube DE",      handle: "@FoodTubeDE",       country: "🇩🇪 Đức",   subs: "73.2K subs",  desc: "Street food, Restaurants und Kochshows aus ganz Deutschland.",                   url: "https://www.youtube.com/@FoodTubeDE" },
  { name: "Mamas Küche",      handle: "@MamasKuche",       country: "🇩🇪 Đức",   subs: "27.5K subs",  desc: "Hausmannskost wie bei Oma – einfache Rezepte mit viel Liebe.",                   url: "https://www.youtube.com/@MamasKuche" },
];

const tbody = document.getElementById('tbody');
const actionInfo = document.getElementById('action-info');

function render() {
  tbody.innerHTML = '';
  DATA.forEach((ch, i) => {
    const tr = document.createElement('tr');
    tr.dataset.idx = i;
    if (ch._checked) tr.classList.add('checked');

    const hasCountry = ch.country !== '—';
    const hasSubs    = ch.subs !== '—';

    tr.innerHTML = `
      <td class="center">
        <input type="checkbox" class="chk" ${ch._checked ? 'checked' : ''} data-i="${i}" />
      </td>
      <td>
        <div class="ch-name">${ch.name}</div>
        <div class="ch-handle">${ch.handle}</div>
      </td>
      <td class="center">
        <span class="country ${hasCountry ? '' : 'unknown'}">${ch.country}</span>
      </td>
      <td class="center">
        <span class="subs ${hasSubs ? '' : 'empty'}">${ch.subs}</span>
      </td>
      <td><span class="desc">${ch.desc}</span></td>
      <td class="url-cell">
        <a href="${ch.url}" target="_blank">
          <span class="url-icon">🔗</span>${ch.url.replace('https://www.youtube.com/','youtube.com/')}
        </a>
      </td>
    `;

    tr.querySelectorAll('td:not(.center):not(.url-cell)').forEach(td => {
      td.style.cursor = 'pointer';
      td.addEventListener('click', () => {
        DATA[i]._checked = !DATA[i]._checked;
        render();
      });
    });

    tbody.querySelector(`[data-i="${i}"]`)?.addEventListener?.('change', e => {});
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('.chk').forEach(chk => {
    chk.addEventListener('change', e => {
      const i = +e.target.dataset.i;
      DATA[i]._checked = e.target.checked;
      render();
    });
  });

  const checked = DATA.filter(d => d._checked).length;
  actionInfo.textContent = checked > 0 ? `✅ Đã chọn ${checked} kênh` : '';
}

render();

// Button select-all / deselect
document.querySelectorAll('.action-btns .btn').forEach((btn, i) => {
  btn.addEventListener('click', () => {
    DATA.forEach(d => d._checked = i === 0);
    render();
  });
});
</script>
</body>
</html>
